<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>FotoMarket Local - Sigur și Rapid</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; }
        .nav { background: #2c3e50; color: white; padding: 15px; text-align: center; }
        .container { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
        .upload-section { background: white; padding: 20px; margin: 20px; border-radius: 10px; border: 2px dashed #3498db; }
        input { display: block; margin: 10px auto; padding: 8px; width: 80%; }
        button { background: #3498db; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
        .del-btn { background: #e74c3c; margin-top: 10px; font-size: 12px; }
    </style>
</head>
<body>

<div class="nav">
    <h1>FotoMarket Local</h1>
    <p>Toate datele tale sunt salvate în siguranță pe acest PC</p>
</div>

<div class="upload-section">
    <h3>Postează un Anunț Nou</h3>
    <input type="text" id="itemName" placeholder="Ce vinzi?">
    <input type="file" id="itemImg" accept="image/*">
    <button onclick="saveToLocal()">Postează Anunțul</button>
</div>

<div class="container" id="gallery"></div>

<script>
    // 1. Încărcăm datele salvate imediat ce se deschide pagina
    window.onload = function() {
        renderGallery();
    };

    function saveToLocal() {
        const name = document.getElementById('itemName').value;
        const file = document.getElementById('itemImg').files[0];

        if (name && file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                // Creăm obiectul anunțului
                const newAd = {
                    id: Date.now(),
                    title: name,
                    image: e.target.result // Imaginea este salvată ca text lung
                };

                // Luăm lista veche din localStorage sau creăm una nouă dacă e gol
                let ads = JSON.parse(localStorage.getItem('myLocalAds')) || [];
                ads.push(newAd);

                // Salvăm lista înapoi în "dulăpiorul" browserului
                localStorage.setItem('myLocalAds', JSON.stringify(ads));

                renderGallery();
                document.getElementById('itemName').value = "";
            };
            reader.readAsDataURL(file);
        } else {
            alert("Pune un nume și alege o poză!");
        }
    }

    function renderGallery() {
        const gallery = document.getElementById('gallery');
        const ads = JSON.parse(localStorage.getItem('myLocalAds')) || [];
        
        gallery.innerHTML = ""; // Ștergem tot și redesenăm lista actualizată

        ads.forEach(ad => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${ad.image}">
                <h3>${ad.title}</h3>
                <button class="del-btn" onclick="deleteAd(${ad.id})">Șterge</button>
            `;
            gallery.appendChild(card);
        });
    }

    function deleteAd(id) {
        let ads = JSON.parse(localStorage.getItem('myLocalAds')) || [];
        ads = ads.filter(ad => ad.id !== id); // Păstrăm doar ce NU vrem să ștergem
        localStorage.setItem('myLocalAds', JSON.stringify(ads));
        renderGallery();
    }
</script>

</body>
</html>
